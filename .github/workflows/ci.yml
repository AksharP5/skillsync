name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node.label }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - { label: "20", version: "20.17.0" }
          - { label: "22", version: "22.13.0" }
          - { label: "23.5.0", version: "23.5.0" }
          - { label: "24", version: "24" }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node.version }}
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm pack --dry-run
