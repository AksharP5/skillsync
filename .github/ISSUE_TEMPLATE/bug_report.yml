name: Bug report
description: Report a reproducible SkillSync problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private skill contents, tokens, or credentials.
  - type: input
    id: version
    attributes:
      label: SkillSync version
      placeholder: "0.5.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
